name: CI

on:
  push:
  pull_request:

jobs:
  banco-de-dados:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: locadora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: locadora

    steps:
      - uses: actions/checkout@v4

      - name: Instalar cliente psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Criar schema, dados e camada analítica
        run: |
          for f in sql/*.sql; do
            echo ">> $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Rodar testes
        run: psql -v ON_ERROR_STOP=1 -f tests/test_regras.sql

      - name: Rodar consultas analíticas
        run: psql -v ON_ERROR_STOP=1 -f analises/consultas_analiticas.sql > /dev/null
